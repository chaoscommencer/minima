# Global author information is used to propagate the creator field of Twitter
# summary cards.  This should be an author-specific, not site-wide Twitter
# handle (the site-wide username should be stored as site.twitter.username
# instead).
# author: <Twitter_handle_without_@_prefix>
# NOTE: For this and the following, the actual Twitter handle is resolved to
# "@<Twitter_handle_without_@_prefix>"
# NOTE: To account for multiple authors, instead complete author information in
# `_data/authors.yml`.  Specify the appropriate author as the object field name
# in each [post/page/etc.]'s front matter.
# NOTE: Used by the Jekyll Feed plugin (cannot be moved without modification to
# jekyll-feed--except for to `_data/authors.yml` file)
# NOTE: Used by the Jekyll SEO Tag plugin (cannot be moved without modification
# to jekyll-seo-tag--except for to `_data/authors.yml` file)
# author_1:
#     name: GitHub User
#     email: your-email@domain.com
#     twitter: jekyllrb
#     # picture: /img/benbalter.png

#     # Starting from August 6, 2021 [Google recommends](https://developers.google.com/search/updates) to set the author.url
#     # property. This property helps Google to disambiguate the correct author
#     # of the article.
#     # url:

#     # social links
#     social:
#         # - type: dribbble
#         #   username: jekyll
#         # - type: facebook
#         #   username: jekyll
#         # - type: flickr
#         #   username: jekyll
#         - type: github
#           username:  jekyll
#         # - type: instagram
#         #   username: jekyll
#         # - type: linkedin
#         #   username: jekyll
#         # - type:  pinterest
#         #   username: jekyll
#         # Mastodon instances
#         # - type: mastodon
#         #   username: jekyll
#         #   instance: example.com
#         # - type: mastodon
#         #   username: jekyll2
#         #   instance: example.com
#         - type: twitter
#           username: jekyllrb
#         # - type: youtube
#         #   username: jekyll
#         # - type: googleplus
#         #   username: +jekyll
#         # - type: rss
#         #   display_name: rss
#         #   feed: /feed.xml
